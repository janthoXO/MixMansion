[project]
name = "mixmansion"
version = "0.1.0"
description = "Sort your Spotify library into new playlists by vibe, with a plan you approve before anything changes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "questionary>=2.0",
    "requests-cache>=1.2",
    "typer>=0.15",
]

[project.scripts]
mixmansion = "mixmansion.interfaces.cli:main"

[dependency-groups]
dev = ["import-linter>=2.1", "pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
