[project]
name = "mixmansion"
version = "0.1.0"
description = "Sort your Spotify library into new playlists by vibe, with a plan you approve before anything changes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["spotify", "playlist", "music", "mood", "vibe", "llm", "cli", "louvain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Utilities",
]
dependencies = [
    "litellm==1.102.0",
    "networkx>=3.5",
    "numpy>=2.1",
    "py3langid>=0.4.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "questionary>=2.0",
    "requests-cache>=1.2",
    "ruamel-yaml>=0.19",
    "spotipy>=2.26",
    "typer>=0.15",
]

[project.urls]
Homepage = "https://github.com/janthoXO/MixMansion"
Repository = "https://github.com/janthoXO/MixMansion"
Issues = "https://github.com/janthoXO/MixMansion/issues"
Releases = "https://github.com/janthoXO/MixMansion/releases"

[project.scripts]
mixmansion = "mixmansion.interfaces.cli:main"

[dependency-groups]
dev = ["import-linter>=2.1", "pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
