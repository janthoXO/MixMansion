name: Feature request
description: Suggest an idea or new adapter for MixMansion
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? What's missing or awkward today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Which pipeline stage or port does this touch?
      options:
        - retriever
        - categorizer
        - grouper
        - namer
        - writer
        - pool store
        - plan store
        - CLI
        - other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches or workarounds you've thought about.
