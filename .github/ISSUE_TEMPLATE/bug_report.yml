name: Bug report
description: Report a problem with MixMansion
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact command(s) you ran, in order.
      placeholder: |
        uv run mixmansion pool add playlist
        uv run mixmansion plan -o plan.yaml
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MixMansion version
      description: Output of `mixmansion --version`
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS / Python / install method
      description: Pick the closest match (mention exact versions in the description if it matters).
      options:
        - macOS / Python 3.12+ / uv
        - Linux / Python 3.12+ / uv
        - Windows / Python 3.12+ / uv
        - Docker
        - Other (describe above)
    validations:
      required: true

  - type: textarea
    id: debug-output
    attributes:
      label: Output with --debug
      description: Re-run the command with `--debug` and paste the output. Remove any secrets or tokens first.
      render: shell

  - type: checkboxes
    id: secrets-removed
    attributes:
      label: Confirmation
      options:
        - label: I removed secrets/tokens from the output above
          required: true
